# Render Blueprint — web service only (use your existing Postgres).
# Do NOT add a `databases:` block here if you already created Postgres on Render.
# After deploy: set DATABASE_URL on the service to your existing DB connection string.
# Docs: docs/DEPLOY.md

services:
  - type: web
    name: event-management
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm ci &&
      npm run build &&
      rm -rf ../backend/static &&
      cp -r dist ../backend/static
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
